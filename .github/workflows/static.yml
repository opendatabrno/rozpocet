name: Deploy Static HTML and Run Python

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Spuštění Python skriptu (Příprava dat)
        run: |
          pip install -r requirements.txt
          python ./scripts/build_data.py

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrání statických souborů
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
